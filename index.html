<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Spotify Downloader PRO</title>
</head>

<body style="background:#111;color:white;text-align:center;padding-top:60px">

<h2>Spotify / YouTube Downloader PRO</h2>

<input id="q" style="padding:10px;width:300px">
<button onclick="go()">Descargar</button>

<p id="st"></p>

<script>
async function go(){
    const q = document.getElementById("q").value.trim();
    const st = document.getElementById("st");

    if(!q){
        st.innerText = "Escribe algo";
        return;
    }

    try {
        st.innerText = "Descargando...";

        const r = await fetch(`/download?q=${encodeURIComponent(q)}`);

        if(!r.ok){
            throw new Error("Backend error " + r.status);
        }

        const d = await r.json();

        if(!d.folder){
            throw new Error("No folder returned");
        }

        st.innerText = "Generando ZIP...";

        window.location.href = `/get-zip?file=${d.folder.split("/").pop()}`;

    } catch (err) {
        console.log(err);
        st.innerText = "Error: " + err.message;
    }
}
</script>

</body>
</html>
