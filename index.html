<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Listas Spotify</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.6rem; margin-bottom: 8px; color: #1db954; }
        p.sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #1db954; }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 13px;
            background: #1db954;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #17a349; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 0.9rem; color: #aaa; min-height: 24px; }
        .progress-bar {
            margin-top: 12px;
            background: #333;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: #1db954;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 Descargador Spotify</h1>
    <p class="sub">Pega el enlace de una playlist de Spotify</p>
    <input id="link" type="text" placeholder="https://open.spotify.com/playlist/...">
    <button id="btn" onclick="procesar()">¡PROCESAR!</button>
    <div id="status">Listo para descargar</div>
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>
<script>
function procesar() {
    const url = document.getElementById('link').value.trim();
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    if (!url) { status.innerText = "⚠️ Pega un enlace primero"; return; }

    btn.disabled = true;
    progressBar.style.display = "block";
    progressFill.style.width = "0%";
    status.innerText = "Iniciando proceso...";

    const baseUrl = window.location.origin;
    const ev = new EventSource(`${baseUrl}/playlist-progress?url=${encodeURIComponent(url)}`);

    ev.onmessage = (e) => {
        const data = JSON.parse(e.data);
        status.innerText = data.status;

        if (data.current && data.total) {
            const pct = Math.round((data.current / data.total) * 100);
            progressFill.style.width = pct + "%";
        }

        if (data.status === "Completado" && data.file) {
            ev.close();
            btn.disabled = false;
            progressFill.style.width = "100%";
            status.innerText = "✅ Descargando ZIP...";
            window.location.href = `${baseUrl}/get-zip?file=${data.file}`;
        }

        if (data.status && data.status.startsWith("Error")) {
            ev.close();
            btn.disabled = false;
            status.style.color = "#e74c3c";
        }
    };

    ev.onerror = () => {
        ev.close();
        btn.disabled = false;
        status.innerText = "❌ Error de conexión";
    };
}
</script>
</body>
</html>
